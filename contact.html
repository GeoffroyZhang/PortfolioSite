<!DOCTYPE html>
<!-- Le site sera en langue française majoritairement avec un peu de chinois et d'anglais sûrement -->
<html>


<head>
    <meta charset="utf-8">
    <!-- La balise title affiche seulement le titre de la page dans l'onglet -->
    <title>Contact</title>
    <!-- Ajout de la balise link pour joindre le fichier HTML au fichier CSS -->
    <link rel="stylesheet" href="style/style.css"/>
    <link rel="stylesheet" href="style/contact.css">
    <!-- Importation des kits de fontawesome -->
    <script src="https://kit.fontawesome.com/85447f10bb.js" crossorigin="anonymous"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

    <header>
        <img src="images/index/Arsenal_originale.jpg" alt="Logo du site">
        <nav class="nav">
            <a href="index.html">Accueil</a>
            <a href="a-propos.html">À propos</a>
            <a href="projets.html">Projets</a>
            <a href="ressources.html">Ressources</a>
            <a href="articles.html">Articles</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    
    <main>
    
    <section class="page-contact">
        <!-- Création de la structure du formulaire -->
        <form action="" method="get">
            <h1>Contactez-moi !</h1>
            <div class="separation"></div>
            <div class="corps-formulaire">
                <div class="gauche">
                    <div class="groupe">
                        <label for="prenom">Votre prénom</label>
                        <!-- Auto focus sur l'input prénom -->
                        <input type="text" name="prenom" id="prenom" autofocus>
                        <i class="fa-solid fa-user form-icon"></i>
                    </div>
                    <div class="groupe">
                        <label for="nom">Votre nom</label>
                        <input type="text" name="nom" id="nom">
                        <i class="fa-solid fa-id-badge form-icon"></i>
                    </div>
                    <div class="groupe">
                        <label for="email">Votre adresse e-mail</label>
                        <input type="email" name="email" id="email" required>
                        <i class="fa-solid fa-envelope form-icon"></i>
                    </div> 
                    <div class="groupe">
                        <label for="ville">Votre ville</label>
                        <input type="text" name="ville" id="ville">
                        <i class="fa-solid fa-location-dot form-icon"></i>
                    </div>
                </div>
                <div class="droite">
                    <div class="groupe">
                        <label>Message</label>
                        <textarea placeholder="Saisissez ici..."></textarea>
                    </div>
                </div>
            </div>

            <div class="pied-formulaire">
                    <input type="submit" value="Envoyer le message">
            </div>

        </form>

    </section>


    </main>

    <footer>
        <div>
            <a target="_blank" href="https://github.com/GeoffroyZhang/protocole_recherche_sdhc_memoire">
                <img src="images/index/github_logo.svg" alt="Logo du site web GitHub"/>
            </a>

            <a target="_blank" href="https://www.linkedin.com/in/geoffroy-zhang">
                <img src="images/index/linkedin_logo.svg" alt="Logo du site web LinkedIn"/>
            </a>
        </div>
    </footer>

</body>

</html>
