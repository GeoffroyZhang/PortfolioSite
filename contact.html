<!DOCTYPE html>
<!-- Le site sera en langue française majoritairement avec un peu de chinois et d'anglais sûrement -->
<html lang="fr">


<head>
    <meta charset="utf-8">
    <!-- La balise title affiche seulement le titre de la page dans l'onglet -->
    <title>Contact</title>
    <!-- Ajout de la balise link pour joindre le fichier HTML au fichier CSS -->
    <link rel="stylesheet" href="style/style.css"/>
    <link rel="stylesheet" href="style/contact.css">
    <!-- Importation des kits de fontawesome -->
    <script src="https://kit.fontawesome.com/85447f10bb.js" crossorigin="anonymous"></script>
</head>

<body>

    <header>
        <img src="images/index/Arsenal_originale.jpg" alt="Logo du site">
        <nav class="nav">
            <a href="index.html">Accueil</a>
            <a href="a-propos.html">À propos</a>
            <a href="projets.html">Projets</a>
            <a href="ressources.html">Ressources</a>
            <a href="articles.html">Articles</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    
    <main>
    
    <section class="page-contact">
        <!-- Création de la structure du formulaire -->
        <form>
            <h1>Contactez-moi !</h1>
            <div class="separation"></div>
            <div class="corps-formulaire">
                <div class="gauche">
                    <div class="groupe">
                        <label>Votre prénom</label>
                        <input type="text">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="groupe">
                        <label>Votre nom</label>
                        <input type="text">
                        <i class="fa-solid fa-id-badge"></i>
                    </div>
                    <div class="groupe">
                        <label>Votre adresse e-mail</label>
                        <input type="e-mail">
                        <i class="fa-solid fa-envelope"></i>
                    </div>    
                </div>
                <div class="droite">
                    <div class="groupe">
                        <label>Message</label>
                        <textarea></textarea>
                    </div>
                </div>
            </div>

            <div class="pied-formulaire">
                    <button>Envoyer le message</button>
            </div>

        </form>

    </section>


    </main>

    <footer>
        <div>
            <a target="_blank" href="https://github.com/GeoffroyZhang/protocole_recherche_sdhc_memoire">
                <img src="images/index/github_logo.svg" alt="Logo du site web GitHub"/>
            </a>

            <a target="_blank" href="https://www.linkedin.com/in/geoffroy-zhang">
                <img src="images/index/linkedin_logo.svg" alt="Logo du site web LinkedIn"/>
            </a>
        </div>
    </footer>

</body>

</html>
